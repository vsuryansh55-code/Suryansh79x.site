<!DOCTYPE html>
<html>
<head>
    <title>Hacker Terminal</title>

    <style>
        body {
            background: black;
            color: lime;
            font-family: Consolas;
            padding: 30px;
        }

        #terminal {
            white-space: pre-line;
            font-size: 18px;
        }

        button {
            background: black;
            color: lime;
            border: 1px solid lime;
            padding: 10px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h2>SECURE ACCESS TERMINAL</h2>

<div id="terminal"></div>

<button onclick="startTyping()">ENTER SYSTEM</button>

<script>
const lines = [
"Initializing system...",
"Connecting to server...",
"Bypassing firewall...",
"Decrypting files...",
"Access Granted ✔"
];

let lineIndex = 0;

function typeLine(text, callback) {
    let i = 0;
    let speed = 40;

    function typing() {
        if (i < text.length) {
            document.getElementById("terminal").innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, speed);
        } else {
            document.getElementById("terminal").innerHTML += "\n";
            callback();
        }
    }

    typing();
}

function startTyping() {
    document.getElementById("terminal").innerHTML = "";
    lineIndex = 0;

    function nextLine() {
        if (lineIndex < lines.length) {
            typeLine(lines[lineIndex], () => {
                lineIndex++;
                setTimeout(nextLine, 500);
            });
        }
    }

    nextLine();
}
</script>

</body>
</html>
